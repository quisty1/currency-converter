<!doctype html>
<html lang="ru" data-theme="light" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FX Multi — конвертер валют с несколькими целями сразу"
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FX Multi" />
    <meta
      property="og:description"
      content="Сумма сразу во многих валютах — быстрый конвертер без регистрации"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FX Multi" />
    <meta
      name="twitter:description"
      content="Сумма сразу во многих валютах — быстрый конвертер без регистрации"
    />
    <title>FX Multi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#D61F26" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // мгновенная тема до загрузки модулей, без мигания
      (function () {
        try {
          var raw = localStorage.getItem('fx-multi-state');
          var theme = raw ? JSON.parse(raw).theme || 'system' : 'system';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            theme === 'light' || theme === 'dark'
              ? theme
              : dark
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <div class="shell">
      <header class="top">
        <div class="brand">
          <h1 class="brand-mark" data-i18n="appName">FX Multi</h1>
          <p class="brand-tag" data-i18n="tagline">
            Сумма сразу во многих валютах
          </p>
        </div>

        <div class="controls">
          <label class="field field-compact">
            <span data-i18n="themeLabel">Тема</span>
            <select id="theme" data-i18n-aria="themeLabel">
              <option value="system">Системная</option>
              <option value="light">Светлая</option>
              <option value="dark">Тёмная</option>
            </select>
          </label>

          <label class="field field-compact">
            <span data-i18n="langLabel">Язык</span>
            <select id="locale" data-i18n-aria="langLabel">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
        </div>
      </header>

      <main>
        <section class="convert">
          <div class="convert-grid">
            <label class="field amount-hero">
              <span data-i18n="amountLabel">Сумма</span>
              <input
                id="amount"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                placeholder="100"
                value="100"
              />
            </label>

            <div class="base-row">
              <label class="field convert-base">
                <span data-i18n="baseLabel">Из валюты</span>
                <select id="base"></select>
              </label>
              <button
                type="button"
                id="swap-currencies"
                class="btn-swap"
                data-i18n="swapCurrencies"
                data-i18n-aria="swapCurrencies"
              >
                Поменять
              </button>
            </div>
          </div>

          <div class="status-row">
            <p id="status" class="status" data-tone="muted" role="status"></p>
            <button
              type="button"
              id="refresh-rates"
              class="btn-text"
              data-i18n="refreshRates"
            >
              Обновить
            </button>
          </div>
        </section>

        <section class="results-block" aria-labelledby="results-heading">
          <div class="section-head">
            <h2 id="results-heading" data-i18n="resultsTitle">Результат</h2>
            <button
              type="button"
              id="open-manage"
              class="btn-text"
              aria-expanded="false"
              aria-haspopup="dialog"
              data-i18n="openManage"
            >
              Настроить список
            </button>
          </div>
          <ul id="results" class="results"></ul>
        </section>
      </main>
    </div>

    <div id="manage-panel" class="manage" hidden>
      <div
        class="manage-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="manage-heading"
      >
        <div class="manage-head">
          <div>
            <h2 id="manage-heading" data-i18n="manageTitle">Валюты в списке</h2>
            <p data-i18n="manageHint">Выберите, какие валюты показывать</p>
          </div>
          <button
            type="button"
            id="close-manage"
            class="btn"
            data-i18n="closeManage"
          >
            Готово
          </button>
        </div>
        <label class="manage-search">
          <span class="visually-hidden" data-i18n="searchCurrencies"
            >Поиск валюты</span
          >
          <input
            id="manage-search"
            type="search"
            autocomplete="off"
            data-i18n-placeholder="searchPlaceholder"
            placeholder="Поиск…"
          />
        </label>
        <div id="manage-list" class="manage-list"></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
