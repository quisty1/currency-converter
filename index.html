<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FX Multi — конвертер валют и криптовалют с несколькими целями сразу."
    />
    <meta name="theme-color" content="#3159d9" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FX Multi" />
    <meta
      property="og:description"
      content="Одна сумма — сразу во всех нужных валютах."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>FX Multi — конвертер валют</title>
    <script>
      try {
        // Apply the saved color scheme before React mounts to avoid a theme flash.
        var saved = JSON.parse(localStorage.getItem('fx-multi-state') || '{}');
        var mode = saved.theme || 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
